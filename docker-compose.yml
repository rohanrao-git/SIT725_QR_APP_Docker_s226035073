services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sit725_qr_app
    env_file:
      - backend/.env
    ports:
      - "5001:5001"
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: sit725_qr_db
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  mongo_data:
